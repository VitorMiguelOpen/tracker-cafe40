# Projeto de aplicação SAP UI5.
#
# Usamos o framework SAPUI5 (e não OpenUI5) porque a biblioteca de gráficos
# sap.viz (VizFrame) só existe no SAPUI5. O UI5 Tooling baixa essas libs para um
# cache local (~/.ui5) e o `ui5 serve` as serve em /resources — assim o app NÃO
# depende da CDN do SAP em runtime (funciona em rede corporativa/offline).
# O índice (webapp/index.html) faz bootstrap de resources/sap-ui-core.js (local).
specVersion: "3.0"
metadata:
  name: cafetracker-frontend
type: application
framework:
  name: SAPUI5
  version: "1.120.46"
  libraries:
    - name: sap.f
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: sap.viz
    - name: themelib_sap_horizon
