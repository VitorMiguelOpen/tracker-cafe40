<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café Tracker — SAACE</title>

    <!-- Cliente SignalR (tempo real), servido LOCALMENTE (sem CDN). Expõe window.signalR. -->
    <script src="lib/signalr.min.js"></script>

    <!--
      Bootstrap do SAP UI5 servido LOCALMENTE (sem CDN).
      O UI5 Tooling (ver ui5.yaml: framework SAPUI5 + libs, incl. sap.viz) baixa o
      SAPUI5 para um cache local e o serve em /resources. Assim o app NÃO depende
      da CDN do SAP em runtime — funciona em redes corporativas/offline.
      sap.viz só existe no SAPUI5 (não no OpenUI5), por isso usamos o framework SAPUI5.
    -->
    <script
        id="sap-ui-bootstrap"
        src="resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-libs="sap.ui.core,sap.m,sap.ui.layout,sap.f,sap.viz"
        data-sap-ui-resource-roots='{"cafetracker": "./"}'
        data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compat-version="edge"
        data-sap-ui-async="true"
        data-sap-ui-frame-options="trusted">
    </script>
</head>
<body class="sapUiBody" id="content">
    <div
        data-sap-ui-component
        data-name="cafetracker"
        data-id="container"
        data-settings='{"id": "cafetracker"}'>
    </div>
</body>
</html>
