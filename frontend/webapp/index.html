<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café Tracker — SAACE</title>

    <!-- Cliente SignalR (tempo real). Carregado da CDN; expõe window.signalR. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>

    <!--
      Bootstrap do SAP UI5 a partir da CDN oficial (SAPUI5).
      Usamos a CDN do SAPUI5 (e não o OpenUI5 local) porque a biblioteca de
      gráficos sap.viz (VizFrame) NÃO é publicada no OpenUI5 — só existe no SAPUI5.
      Versão 1.136.0 (LTS), que hospeda todas as libs usadas, inclusive sap.viz.
    -->
    <script
        id="sap-ui-bootstrap"
        src="https://ui5.sap.com/1.136.0/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-libs="sap.ui.core,sap.m,sap.ui.layout,sap.f,sap.viz"
        data-sap-ui-resource-roots='{"cafetracker": "./"}'
        data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compat-version="edge"
        data-sap-ui-async="true"
        data-sap-ui-frame-options="trusted">
    </script>
</head>
<body class="sapUiBody" id="content">
    <div
        data-sap-ui-component
        data-name="cafetracker"
        data-id="container"
        data-settings='{"id": "cafetracker"}'>
    </div>
</body>
</html>
